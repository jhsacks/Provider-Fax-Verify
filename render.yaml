services:
  - type: web
    name: provider-fax-verify
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: GOOGLE_DRIVE_FILE_NAME
        value: provider_fax_data.json
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_DRIVE_FILE_ID
        sync: false
